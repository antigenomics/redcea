    "k_neighbors": [8, 12, 16],
    "eps_k_neighbors": [4, 8, 12],
    "core_min_samples": [3],
    "leiden_resolution": [0.25, 0.5, 1.0],
    "eps_mode": ["sample"],
    "sym_rule": ["asymmetric"]
  }
