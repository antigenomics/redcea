[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcremp"
version = "0.0.1"
authors = [
  { name = "vek239", email = "elizaveta.k.vlasova@gmail.com" },
  { name = "yuliajk", email = "yulia.mow@gmail.com" },
  { name = "mikessh", email = "mikhail.shugay@gmail.com" }
]
description = "A computational method for fuzzy search of disease associated TCR clusters"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent"
]
keywords = ["antigen", "antibody", "t-cell", "receptor", "sequence", "embedding"]
requires-python = ">=3.10"
dependencies = [
  "mir@git+https://github.com/antigenomics/mirpy.git@0.1.2-mirpy-fastAlign",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
  "seaborn>=0.12,<1",
  "scikit-learn>=1.3,<2",
  "biopython>=1.81,<2",
  "kneed>=0.8.5,<1",
  "umap-learn>=0.5.3,<1",
  "textdistance>=4.5,<5",
  "plotnine>=0.12,<1",
  "xgboost>=2.1,<3",
  "olga==1.2.4",
  "psutil>=5.9",
  "faiss-cpu>=1.7.4",
  "pympler>=1.0.1",
  "fastparquet>=2023.4.0",
  "plotly>=5,<7",
  "joblib>=1.3",
  "statsmodels>=0.14,<1",
  "networkx>=3,<4",
  "logomaker>=0.8,<1"
]

[project.optional-dependencies]
leiden = [
  "networkit==11.2; platform_system != 'Windows'"
]
bench = [
  "hnswlib>=0.8.0"
]
all = [
  "networkit==11.2; platform_system != 'Windows'",
  "hnswlib>=0.8.0"
]

[project.scripts]
tcremp-run = "tcremp.tcremp_run:main"
tcremp-cluster = "tcremp.tcremp_cluster:main"
tcrempnet = "tcremp.tcrempnet:main"

[tool.hatch.metadata]
allow-direct-references = true
