[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcremp"
version = "0.0.1"
authors = [
  { name = "vek239", email = "elizaveta.k.vlasova@gmail.com" },
  { name = "yuliajk", email = "yulia.mow@gmail.com" },
  { name = "mikessh", email = "mikhail.shugay@gmail.com" }
]
description = "A computational method for fuzzy search of disease associated TCR clusters"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent"
]
keywords = ["antigen", "antibody", "t-cell", "receptor", "sequence", "embedding"]
requires-python = ">=3.10"
dependencies = [
  "mir@git+https://github.com/antigenomics/mirpy.git@0.1.0-mirpy-tcrempnet",
  "numpy==1.26.4",
  "scipy==1.11.4",
  "pandas==2.0.3",
  "matplotlib==3.7.2",
  "seaborn==0.12.2",
  "scikit-learn==1.3.0",
  "biopython==1.81",
  "kneed==0.8.5",
  "umap-learn==0.5.3",
  "textdistance==4.5.0",
  "plotnine==0.12.3",
  "xgboost==2.1.2",
  "python_igraph==0.10.6",
  "olga==1.2.4",
  "psutil>=5.9",
  "faiss-cpu>=1.7.4"
]

[project.scripts]
tcremp-run = "tcremp.tcremp_run:main"
tcremp-cluster = "tcremp.tcremp_cluster:main"
tcrempnet = "tcremp.tcrempnet:main"

[tool.hatch.metadata]
allow-direct-references = true
