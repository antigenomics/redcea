[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcremp"
version = "0.0.1"
authors = [
  { name = "vek239", email = "elizaveta.k.vlasova@gmail.com" },
  { name = "yuliajk", email = "yulia.mow@gmail.com" },
  { name = "mikessh", email = "mikhail.shugay@gmail.com" }
]
description = "A computational method for fuzzy search of disease associated TCR clusters"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent"
]
keywords = ["antigen", "antibody", "t-cell", "receptor", "sequence", "embedding"]
requires-python = ">=3.10"
dependencies = [
  "mir@git+https://github.com/antigenomics/mirpy.git@0.1.2-mirpy-fastAlign",
  "numpy==2.3.5",
  "scipy==1.16.3",
  "pandas",
  "matplotlib",
  "seaborn",
  "scikit-learn",
  "biopython",
  "kneed",
  "umap-learn",
  "textdistance",
  "plotnine",
  "xgboost",
  "olga==1.2.4",
  "psutil>=5.9",
  "faiss-cpu>=1.7.4",
  "pympler>=1.0.1",
  "fastparquet>=2023.4.0",
  "networkit==11.2"
]

[project.scripts]
tcremp-run = "tcremp.tcremp_run:main"
tcremp-cluster = "tcremp.tcremp_cluster:main"
tcrempnet = "tcremp.tcrempnet:main"

[tool.hatch.metadata]
allow-direct-references = true
