[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redcea"
version = "0.0.1"
authors = [
  { name = "vek239", email = "elizaveta.k.vlasova@gmail.com" },
  { name = "mikessh", email = "mikhail.shugay@gmail.com" }
]
description = "Repertoire embeddings denoising clustering enrichment analysis"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent"
]
keywords = ["antigen", "antibody", "t-cell", "receptor", "sequence", "embedding"]
requires-python = ">=3.10"
dependencies = [
  "tcremp@git+https://github.com/antigenomics/tcremp",
  "mirpy-lib==1.0.0",
  "numpy==2.3.5",
  "scipy==1.16.3",
  "pandas",
  "matplotlib",
  "seaborn",
  "scikit-learn",
  "biopython",
  "kneed",
  "umap-learn",
  "textdistance",
  "plotnine",
  "xgboost",
  "olga==1.2.4",
  "psutil>=5.9",
  "faiss-cpu>=1.7.4",
  "pympler>=1.0.1",
  "fastparquet>=2023.4.0",
  "plotly>=5,<7",
  "joblib>=1.3",
  "networkit==11.2; platform_system != 'Windows'",
  "networkx>=3,<4",
  "logomaker>=0.8,<1"
]

[project.optional-dependencies]
leiden = []
bench = [
  "hnswlib>=0.8.0"
]
all = [
  "hnswlib>=0.8.0"
]
test = [
  "pytest>=8,<9"
]

[project.scripts]
tcremp-run = "tcremp.tcremp_run:main"
tcremp-cluster = "tcremp.tcremp_cluster:main"
tcrempnet = "redcea.redcea:main"
redcea = "redcea.redcea:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
